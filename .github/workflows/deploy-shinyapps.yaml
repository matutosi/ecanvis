name: deploy-shinyapps.yaml

  # Deploy R/ to https://matutosi.shinyapps.io/ecanvis/
  #
  # Needs two repository secrets, from shinyapps.io -> Account -> Tokens:
  #   SHINYAPPS_TOKEN
  #   SHINYAPPS_SECRET
  # Without them the deploy step stops; nothing else in the repository does.

permissions: read-all

on:
  push:
    branches:
      - main
    paths:
        # Only the app itself is deployed, so nothing else needs to trigger it.
        # render-rmarkdown.yaml pushes analysis.html back to main on every run;
        # that push must not redeploy the app.
      - 'R/**'
      - '.github/workflows/deploy-shinyapps.yaml'
  workflow_dispatch:   # and by hand, from the Actions tab

jobs:
  deploy:
      # The rendered output is pushed by the bot itself: do not answer it.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          # binaries from the public Posit package manager: without this the
          # dependencies of vegan and ggplot2 are compiled from source
          use-public-rspm: true

      - name: Cache the R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('R/*.R') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Install the packages the app needs
        shell: Rscript {0}
        run: |
          # The list is read out of the code rather than written here, so that
          # it cannot drift from R/global.R.  It is the same scan that
          # rsconnect makes to decide what to bundle.
          install.packages(c("rsconnect", "remotes", "renv"))
          deps <- unique(renv::dependencies("R", quiet = TRUE)$Package)
          base <- rownames(installed.packages(priority = "base"))
          # ecan is on GitHub only, so it is installed on its own: this is what
          # lets rsconnect record it as a github package and lets shinyapps.io
          # restore it.
          install.packages(setdiff(deps, c(base, "ecan")))
          remotes::install_github("matutosi/ecan", upgrade = "never")

      - name: Check that the bundle resolves
        shell: Rscript {0}
        run: |
          # Stops here, before anything is published, if a package cannot be
          # resolved (an unknown source, or one that is not installed).
          deps <- rsconnect::appDependencies("R")
          cat("packages in the bundle:", nrow(deps), "\n")
          stopifnot("ecan" %in% deps$Package)

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          token  <- Sys.getenv("SHINYAPPS_TOKEN")
          secret <- Sys.getenv("SHINYAPPS_SECRET")
          if(!nzchar(token) || !nzchar(secret))
            stop("Set the SHINYAPPS_TOKEN and SHINYAPPS_SECRET secrets first.")
          rsconnect::setAccountInfo(name = "matutosi",
                                    token = token, secret = secret)
          # appName picks the existing app up: the deploy record under
          # R/rsconnect/ is not in the repository (.gitignore).
          rsconnect::deployApp(appDir      = "R",
                               appName     = "ecanvis",
                               account     = "matutosi",
                               forceUpdate = TRUE)
